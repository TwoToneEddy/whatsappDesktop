[project]
name = "whatsapp-terminal"
version = "0.1.0"
description = "A lightweight WhatsApp terminal client"
requires-python = ">=3.11"
dependencies = ["prompt-toolkit>=3.0.50,<4", "platformdirs>=4,<5", "textual>=8.2.8,<9", "emoji>=2.14,<3", "segno>=1.6,<2"]

[project.scripts]
wat = "whatsapp_terminal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
